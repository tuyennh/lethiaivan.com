<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang · Lê Thị Ái Vân</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Literata:ital,opsz,wght@1,7..72,400&display=swap">
<style>
  :root { --bg: #faf8f4; --fg: #25211d; --muted: #66615b; --pine: #183b56; --brass: #9a6614; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1b28; --fg: #f1ece4; --muted: #a6b0bb; --pine: #e9bc63; --brass: #e9bc63; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .n { font-family: "Literata", Georgia, serif; font-style: italic; font-size: clamp(5rem, 20vw, 9rem); line-height: 1; color: var(--pine); margin: 0; }
  p { color: var(--muted); max-width: 40ch; margin: 1rem auto 2rem; }
  a { display: inline-block; padding: .85rem 1.4rem; border-radius: 999px; background: var(--pine); color: var(--bg); text-decoration: none; font-weight: 500; }
  small { display: block; margin-top: 2rem; color: var(--brass); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
  <main>
    <h1 class="n">404</h1>
    <p>Trang bạn tìm không tồn tại hoặc đã được chuyển đi.</p>
    <a href="/">Về trang hồ sơ năng lực</a>
    <small>aivanhr.com · Kiến tạo hệ thống nhân sự bền vững</small>
  </main>
</body>
</html>
