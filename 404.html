<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang · Lê Thị Ái Vân</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Literata:ital,opsz,wght@1,7..72,400&display=swap">
<style>
  :root { --bg: #f2f4f0; --fg: #15231f; --muted: #56655f; --pine: #1d4a43; --brass: #b8812a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1614; --fg: #e6eee9; --muted: #9db0a8; --pine: #7cc2b2; --brass: #e2b25c; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: "Be Vietnam Pro", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .n { font-family: "Literata", Georgia, serif; font-style: italic; font-size: clamp(5rem, 20vw, 9rem); line-height: 1; color: var(--pine); margin: 0; }
  p { color: var(--muted); max-width: 40ch; margin: 1rem auto 2rem; }
  a { display: inline-block; padding: .85rem 1.4rem; border-radius: 999px; background: var(--pine); color: var(--bg); text-decoration: none; font-weight: 500; }
  small { display: block; margin-top: 2rem; color: var(--brass); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
  <main>
    <h1 class="n">404</h1>
    <p>Trang bạn tìm không tồn tại hoặc đã được chuyển đi.</p>
    <a href="/">Về trang hồ sơ năng lực</a>
    <small>Lê Thị Ái Vân · Tư vấn Quản trị nhân sự</small>
  </main>
</body>
</html>
