# Nginx site config for lethiaivan.com (static site).
# Certbot will add the HTTPS (443) block and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name lethiaivan.com www.lethiaivan.com;

    root /var/www/lethiaivan.com;
    index index.html;
    charset utf-8;

    # www -> apex
    if ($host = www.lethiaivan.com) {
        return 301 $scheme://lethiaivan.com$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: always revalidate so content updates show immediately
    location ~* \.html$ {
        # add_header here replaces the server-level ones, so repeat them
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # CSS/JS: short cache (file names are not fingerprinted)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Images, fonts, documents
    location ~* \.(webp|jpg|jpeg|png|svg|ico|pdf|vcf|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ /\. { deny all; }

    error_page 404 /404.html;
}
